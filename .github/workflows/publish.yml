# Stages a new npm version when a version tag (e.g. v0.7.1) is pushed, and creates a GitHub release.
# The staged version becomes public only after a maintainer approves it with 2FA, on npmjs.com or
# with `npm stage approve` (staged publishing).
#
# One-time setup on npmjs.com: package settings → Trusted Publisher → GitHub Actions,
# user bazn, repository n8n-nodes-matrix42-esm, workflow publish.yml,
# allowed action "npm stage publish" only.
#
# Release: update CHANGELOG.md, run `npm version <patch|minor|major>` and `git push --follow-tags`,
# then approve the staged version.
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm install -g npm@latest # trusted and staged publishing need a recent npm

      # prepublishOnly runs lint and unit tests. Provenance is generated automatically
      # for trusted publishing from public repositories.
      - name: Stage the new version on npm
        run: npm stage publish --access public

      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == "## " v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > release-notes.md
          printf '\n---\nThe npm package becomes available once the staged version has been approved.\n' >> release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
