# Publishes to npm when a version tag (e.g. v0.7.1) is pushed, and creates a GitHub release.
#
# One-time setup, choose one:
#  - Trusted publishing (recommended): on npmjs.com open the package settings → Trusted Publisher →
#    GitHub Actions, repository bazn/n8n-nodes-matrix42-esm, workflow publish.yml.
#  - Token: create a granular access token with publish rights for this package on npmjs.com and
#    store it as the repository secret NPM_TOKEN.
#
# Release: update CHANGELOG.md, run `npm version <patch|minor|major>` and `git push --follow-tags`.
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm install -g npm@latest # trusted publishing needs a recent npm

      # prepublishOnly runs lint and unit tests
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == "## " v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
